<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d9ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5b7aff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <g transform="translate(400, 400)">
    <!-- Snowflake center -->
    <circle cx="0" cy="0" r="40" fill="none" stroke="url(#glow)" stroke-width="8"/>
    <!-- Arms -->
    <g id="arm" stroke="url(#glow)" stroke-width="8" fill="none" stroke-linecap="round">
      <line x1="0" y1="0" x2="0" y2="-150"/>
      <line x1="0" y1="-80" x2="-30" y2="-110"/>
      <line x1="0" y1="-80" x2="30" y2="-110"/>
    </g>
    <use href="#arm" transform="rotate(60)"/>
    <use href="#arm" transform="rotate(120)"/>
    <use href="#arm" transform="rotate(180)"/>
    <use href="#arm" transform="rotate(240)"/>
    <use href="#arm" transform="rotate(300)"/>
    <!-- Icons on arms -->
    <!-- Lock icon -->
    <g transform="translate(0, -180)">
      <circle cx="0" cy="0" r="35" fill="none" stroke="#ffffff" stroke-width="6"/>
      <rect x="-15" y="-5" width="30" height="20" rx="3" fill="none" stroke="#00d9ff" stroke-width="4"/>
      <path d="M -10,-5 Q -10,-15 0,-15 Q 10,-15 10,-5" fill="none" stroke="#00d9ff" stroke-width="4"/>
    </g>
    <!-- Link icon -->
    <g transform="translate(155, -90) rotate(60)">
      <circle cx="0" cy="0" r="35" fill="none" stroke="#ffffff" stroke-width="6"/>
      <path d="M -10,-10 L -5,-5 M 5,5 L 10,10 M -15,0 Q -15,-15 0,-15 L 10,-15 M 0,15 L -10,15 Q -15,15 -15,0" fill="none" stroke="#00d9ff" stroke-width="4" stroke-linecap="round"/>
    </g>
    <!-- Shield check -->
    <g transform="translate(155, 90) rotate(120)">
      <circle cx="0" cy="0" r="35" fill="none" stroke="#ffffff" stroke-width="6"/>
      <path d="M 0,-15 L 12,0 L 0,15 L -12,0 Z" fill="none" stroke="#5b7aff" stroke-width="4"/>
      <polyline points="-6,0 -2,5 6,-5" fill="none" stroke="#5b7aff" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- Dollar -->
    <g transform="translate(0, 180) rotate(180)">
      <circle cx="0" cy="0" r="35" fill="none" stroke="#ffffff" stroke-width="6"/>
      <circle cx="0" cy="0" r="15" fill="none" stroke="#5b7aff" stroke-width="4"/>
      <text x="0" y="7" font-family="Arial" font-size="18" fill="#5b7aff" text-anchor="middle" font-weight="bold">$</text>
    </g>
    <!-- Network -->
    <g transform="translate(-155, 90) rotate(240)">
      <circle cx="0" cy="0" r="35" fill="none" stroke="#ffffff" stroke-width="6"/>
      <circle cx="-8" cy="-8" r="3" fill="#00d9ff"/>
      <circle cx="8" cy="-8" r="3" fill="#00d9ff"/>
      <circle cx="0" cy="8" r="3" fill="#00d9ff"/>
      <line x1="-8" y1="-8" x2="8" y2="-8" stroke="#00d9ff" stroke-width="2"/>
      <line x1="-8" y1="-8" x2="0" y2="8" stroke="#00d9ff" stroke-width="2"/>
      <line x1="8" y1="-8" x2="0" y2="8" stroke="#00d9ff" stroke-width="2"/>
    </g>
    <!-- Shield -->
    <g transform="translate(-155, -90) rotate(300)">
      <circle cx="0" cy="0" r="35" fill="none" stroke="#ffffff" stroke-width="6"/>
      <path d="M 0,-15 L 10,-10 L 10,5 Q 10,15 0,18 Q -10,15 -10,5 L -10,-10 Z" fill="none" stroke="#5b7aff" stroke-width="4"/>
      <polyline points="-5,0 -2,4 5,-5" fill="none" stroke="#5b7aff" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
</svg>
