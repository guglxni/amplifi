[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.20"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "paris"

# Remappings
remappings = [
    "@reactive/=lib/reactive-lib/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@aave/v3-core/=lib/aave-v3-core/",
    "forge-std/=lib/forge-std/src/"
]

# RPC endpoints
[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
reactive = "${REACTIVE_RPC_URL}"

# Etherscan verification
[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }

# Testing
[fuzz]
runs = 256
max_test_rejects = 65536

[invariant]
runs = 256
depth = 15
fail_on_revert = false

# Profile for mainnet fork testing (supports PUSH0 opcode)
[profile.mainnet-fork]
evm_version = "shanghai"
